<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Shield/Pill -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#0d1f17" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Circuit Nodes & Lines -->
  <path d="M 22 50 L 34 50 L 42 38 L 58 38 L 66 50 L 78 50" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 50 78 L 50 64 L 38 52" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <path d="M 50 22 L 50 34 L 62 46" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <circle cx="22" cy="50" r="3" fill="#34d399"/>
  <circle cx="78" cy="50" r="3" fill="#34d399"/>
  <circle cx="50" cy="22" r="3" fill="#34d399"/>
  <circle cx="50" cy="78" r="3" fill="#34d399"/>

  <!-- Leaf Shape with Circuit Stem -->
  <path d="M 50 24 C 68 28 78 46 72 66 C 68 76 56 78 50 78 C 44 78 32 76 28 66 C 22 46 32 28 50 24 Z" 
        fill="url(#emeraldGrad)" fill-opacity="0.25" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Leaf Spine & Circuit Branch -->
  <path d="M 50 74 L 50 34" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 50 60 L 62 50" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 50 L 38 42" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
  <path d="M 50 42 L 58 36" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>

  <!-- Microchip Nodes on Leaf -->
  <circle cx="62" cy="50" r="2.5" fill="#a7f3d0"/>
  <circle cx="38" cy="42" r="2.5" fill="#a7f3d0"/>
  <circle cx="58" cy="36" r="2" fill="#a7f3d0"/>
  <circle cx="50" cy="34" r="3" fill="#ecfdf5"/>
</svg>
